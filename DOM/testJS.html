<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>JavaScript DOM & Event Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .highlight {
            background-color: #fff3cd;
            border-color: #ffeeba;
        }

        .text-danger {
            color: red;
        }
    </style>
</head>

<body>
    <h2>ฟอร์มลงทะเบียนสมาชิก (Registration Form)</h2>

    <form id="regForm">
        <div class="form-group">
            <label>ชื่อ-นามสกุล:</label>
            <input type="text" id="fullname" class="input-field" placeholder="กรอกชื่อ-นามสกุล">
            <span id="nameError" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>แผนก/สาขา:</label>
            <select id="department" class="input-field">
                <option value="">-- เลือกแผนก --</option>
                <option value="IT">เทคโนโลยีสารสนเทศ</option>
                <option value="MKT">การตลาด</option>
                <option value="HR">ทรัพยากรบุคคล</option>
            </select>
        </div>

        <div class="form-group">
            <label>ระดับประสบการณ์:</label><br>
            <input type="radio" name="level" value="Junior" class="user-level">Junior
            <input type="radio" name="level" value="Senior" class="user-level">Senior
        </div>

        <div class="form-group">
            <label>ทักษะความสามารถ(เลือกได้มากกว่า 1):</label><br>
            <input type="checkbox" name="skills" value="HTML/CSS"> HTML/CSS
            <input type="checkbox" name="skills" value="JavaScript">JavaScript
            <input type="checkbox" name="skills" value="Database"> Database
        </div>

        <divclass="form-group">
            <label>โปรไฟล์รูปภาพ (URL):</label>
            <input type="text" id="avatarUrl" placeholder="วางลิงกร์ูปภาพที่นี่">
            </div>

            <button type="button" id="btnPreview">ดูตัวอย่างข้อมูล</button>
            <button type="submit" id="btnSubmit">ลงทะเบียน</button>
    </form>

    <hr>

    <h3>พื้นที่แสดงผล(Preview Area)</h3>
    <div id="previewCard" class="card">
        <img id="avatarImg"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwWEI5kmUgtJtXJGX8ELTFZjASETrW87Th4CsmwGKrOA&s=10"
            alt="Profile" width="100">
        <h4 id="dispName">ชื่อ: -</h4>
        <p id="dispDept">แผนก: -</p>
        <p id="dispDetails">รายละเอียด: -</p>
        <div id="jsonResult">
        </div>
    </div>
    <!-- เขียน JavaScript ไวด้านล่างสุด -->
    <script>
        // โค้ด JavaScript ในแต่ละข้อจะถูกเขียนบริเวณนี้
        // ส่วน 2
        console.log('--- ส่วน 2 ---');
        console.log('--- วิธีที่ 1 ---');
        console.log(document.getElementById('btnSubmit'));

        console.log('--- วิธีที่ 2 ---');
        console.log(document.getElementsByClassName('input-field'));

        console.log('--- วิธีที่ 3 ---');
        console.log(document.querySelector('input[name="level"]'));

        console.log('--- วิธีที่ 4 ---');
        const skills = document.querySelectorAll('input[name="skills"]');
        console.log(skills);
        skills.forEach(cb => console.log('value:', cb.value));

        // ส่วน 3
        console.log('--- ส่วน 3 ---');
        btnPreview.onclick = function () {
            alert('กำลังประมวลผล...');
        };
        const department = document.getElementById('department');
        department.onchange = function () {
            console.log('แผนกที่เลือก:', this.value)
        }

        const fullname = document.getElementById('fullname');
        const nameError = document.getElementById('nameError');
        fullname.onkeyup = function () {
            if (this.value.length < 3 && this.value != 0) {
                nameError.innerText = 'ชื่อต้องยาวกว่า 3 ตัวอักษร';
            }
            else {
                nameError.innerText = ''
            }
        };

        const previewCard = document.getElementById('previewCard')
        previewCard.onmouseover = function () {
            this.style.backgroundColor = '#848965'
        };
        previewCard.onmouseout = function () {
            this.style.backgroundColor = ''
        };

        const regForm = document.getElementById('regForm');

        regForm.addEventListener('submit', function (event) {
            event.preventDefault();

            console.log("Event Type:", event.type);
            console.log("Target Element:", event.target);
        });

        // ส่วน 4
        console.log('--- ส่วน 4 ---');
        const fullnameInput = document.getElementById('fullname');
        const dispName = document.getElementById('dispName');
        const departmentSelect = document.getElementById('department');
        const dispDept = document.getElementById('dispDept');

        fullnameInput.addEventListener('keyup', function () {
            dispName.textContent = 'ชื่อ: ' + this.value;

            console.log('--- เปรียบเทียบ ---');
            console.log('textContent:', dispName.textContent);
            console.log('innerText:', dispName.innerText);
            console.log('innerHTML:', dispName.innerHTML);
        });

        departmentSelect.addEventListener('change', function () {
            dispDept.textContent = 'แผนก: ' + this.value;
        });

        const dispNameTest = document.getElementById('dispName');

        // ==========================================
        // ข้อ 2. Complex innerHTML Case
        // ==========================================

        // 1. สร้างฟังก์ชันรับ Array ของทักษะ แล้วใช้ innerHTML สร้าง <ul> กับ <li>
        function renderSkillsList(skillsArray) {
            const dispDetails = document.getElementById('dispDetails');

            // ถ้าผู้ใช้ไม่มีการเลือกทักษะเลย
            if (skillsArray.length === 0) {
                dispDetails.innerHTML = 'รายละเอียด: -';
                return;
            }

            // สร้างจุดเริ่มต้นของแท็ก <ul>
            let htmlContent = 'รายละเอียดทักษะ: <ul>';

            // วนลูปสร้างแท็ก <li> ให้ทักษะแต่ละตัว
            skillsArray.forEach(function (skill) {
                htmlContent += `<li>${skill}</li>`;
            });

            // ปิดแท็ก </ul>
            htmlContent += '</ul>';

            // ยัดโครงสร้าง HTML ทั้งหมดลงใน <p id="dispDetails">
            dispDetails.innerHTML = htmlContent;
        }


        // 2. ดักจับการ ติ๊ก/ปลดติ๊ก Checkbox เพื่อดึงค่าใส่ Array แล้วส่งให้ฟังก์ชันข้างบน
        const skillCheckboxes = document.querySelectorAll('input[name="skills"]');

        skillCheckboxes.forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                let selectedSkills = [];

                // กวาดเช็ค Checkbox ทุกตัว ตัวไหนถูกเลือกให้เอา value ใส่ Array
                skillCheckboxes.forEach(function (cb) {
                    if (cb.checked) {
                        selectedSkills.push(cb.value);
                    }
                });

                // เรียกใช้ฟังก์ชันส่ง Array ไปวาด <ul> <li>
                renderSkillsList(selectedSkills);
            });
        });

        const avatarUrlInput = document.getElementById('avatarUrl');
        const avatarImg = document.getElementById('avatarImg');

        avatarUrlInput.addEventListener('input', function () {
            // 1. ใช้ getAttribute('src') อ่านค่า URL เดิมของรูป
            const oldSrc = avatarImg.getAttribute('src');
            console.log('URL รูปภาพเดิม:', oldSrc);

            // รับค่า URL ใหม่จากช่องที่ผู้ใช้พิมพ์
            const newUrl = this.value;

            // 2. ใช้ setAttribute('src', newUrl) เพื่อเปลี่ยนรูปเป็น URL ใหม่ทันที
            if (newUrl.trim() !== '') {
                avatarImg.setAttribute('src', newUrl);
            } else {
                // ถ้าผู้ใช้ลบข้อความออก ให้คืนค่าเป็นรูปภาพตั้งต้นเดิม
                avatarImg.setAttribute('src', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwWEI5kmUgtJtXJGX8ELTFZjASETrW87Th4CsmwGKrOA&s=10');
            }
        });

        // ==========================================
        // ส่วนที่ 5: Workshop - แปลง Form รวมข้อมูลเป็น Object
        // ==========================================
        const regFormObj = document.getElementById('regForm');

        regFormObj.addEventListener('submit', function (event) {
            // 1. ป้องกันการ Reload หน้าจอด้วย event.preventDefault()
            event.preventDefault();

            // ดึงค่าอินพุตต่างๆ มาเตรียมไว้
            const fullnameVal = document.getElementById('fullname').value.trim();
            const departmentVal = document.getElementById('department').value;

            // ดึงค่า Radio Button (Level) ตัวที่โดน checked
            const selectedLevelEl = document.querySelector('input[name="level"]:checked');
            const levelVal = selectedLevelEl ? selectedLevelEl.value : '';

            // 5. เพิ่มเงื่อนไขตรวจสอบ (Validation): ถ้ายังไม่ได้กรอกชื่อ หรือยังไม่ได้เลือกแผนก ห้ามสร้าง Object
            if (fullnameVal === '' || departmentVal === '') {
                alert('กรุณากรอกชื่อ-นามสกุล และเลือกแผนกให้ครบถ้วนก่อนลงทะเบียน!');
                return; // หยุดการทำงาน ไม่สร้าง Object ด้านล่าง
            }

            // ดึงค่า Checkbox (Skills) รวมรวบเฉพาะตัวที่โดน checked ให้เป็น Array of Strings
            const selectedSkillsList = [];
            const skillCheckboxesList = document.querySelectorAll('input[name="skills"]:checked');
            skillCheckboxesList.forEach(cb => selectedSkillsList.push(cb.value));

            // ดึงค่า Avatar URL
            const avatarVal = document.getElementById('avatarUrl').value || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwWEI5kmUgtJtXJGX8ELTFZjASETrW87Th4CsmwGKrOA&s=10';

            // 2 & 3. นำข้อมูลทั้งหมดจัดเก็บใส่ Object ชื่อ userData
            const userData = {
                fullname: fullnameVal,
                department: departmentVal,
                level: levelVal,
                skills: selectedSkillsList,
                avatar: avatarVal
            };

            // 4. แสดงข้อมูลใน userData ออกทาง Console
            console.log('--- ข้อมูล userData (Object) ---');
            console.log(userData);

            // แถม: แสดงผลก้อน JSON สวยๆ ใน <div id="jsonResult"> บนหน้าเว็บ
            const jsonResult = document.getElementById('jsonResult');
            if (jsonResult) {
                jsonResult.innerHTML = `<pre style="background: #f4f4f4; padding: 10px; border-radius: 5px; font-family: monospace;">${JSON.stringify(userData, null, 2)}</pre>`;
            }

            alert('ลงทะเบียนสำเร็จ! ตรวจสอบข้อมูลใน Console');
        });
    </script>
</body>

</html>
